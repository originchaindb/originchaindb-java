name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: "17"
          - os: ubuntu-latest
            runtime: "21"
          - os: ubuntu-latest
            runtime: "25"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: "${{ matrix.runtime }}"
          distribution: temurin
      - name: Check out the shared API v1 contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: originchaindb/.github
          ref: a47804a80fc5b31022d241dc814d905f6f78e723
          path: .contract-reference
          persist-credentials: false
      - name: Verify cross-language contract
        run: python scripts/check_contract.py
      - name: Build and HTTP contract
        run: python tests/contract/run.py -- mvn -B -ntp verify
      - name: Resilience contract
        run: python tests/contract/resilience.py -- mvn -B -ntp test
      - name: Compile catalog example
        run: |
          mvn -B -ntp dependency:copy-dependencies
          mkdir -p target/examples
          javac -cp "target/classes:target/dependency/*" -d target/examples examples/Catalog.java examples/Integration.java
